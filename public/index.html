<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <h1>Expense Tracker</h1>

      <section class="summary">
        <p id="total">Total: $0.00</p>
        <div class="bar"><div id="budget-bar"></div></div>
        <p id="budget-text"></p>
        <ul id="by-category"></ul>
      </section>

      <form id="add-form" novalidate>
        <label>Title <input name="title" placeholder="What did you buy?"></label>
        <label>Amount in dollars <input name="amount" type="number" step="0.01" min="0" placeholder="11.50"></label>
        <label>Category
          <select name="category">
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="fun">Fun</option>
            <option value="bills">Bills</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label>Date <input name="date" type="date"></label>
        <button>Add expense</button>
        <p id="form-error" class="error" role="alert"></p>
      </form>

      <div class="list-header">
        <h2>Expenses</h2>
        <label>Show
          <select id="filter">
            <option value="all">All</option>
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="fun">Fun</option>
            <option value="bills">Bills</option>
            <option value="other">Other</option>
          </select>
        </label>
      </div>
      <p id="status"></p>
      <ul id="list"></ul>
    </main>
  </body>
</html>
